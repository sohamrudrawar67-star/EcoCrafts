<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" width="100%" height="100%">
  <defs>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8F4FA" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#C5E3F5" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9BCBEB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="prussianBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B425E"/>
      <stop offset="50%" stop-color="#2A5C80"/>
      <stop offset="100%" stop-color="#18364D"/>
    </linearGradient>
    <filter id="cyanShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#173449" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" rx="16" fill="#F6F4EF"/>
  <rect x="12" y="12" width="376" height="356" rx="12" fill="none" stroke="#DCD5C6" stroke-dasharray="4 4" stroke-width="1.5"/>

  <circle cx="200" cy="180" r="140" fill="url(#cyanGlow)"/>

  <!-- Copper Hanging Wire -->
  <path d="M 170 100 C 170 50, 230 50, 230 100" fill="none" stroke="#B87333" stroke-width="3"/>
  <circle cx="200" cy="50" r="4" fill="#B87333"/>

  <!-- Cyanotype Sun-Printed Cylinder Lantern -->
  <g filter="url(#cyanShadow)">
    <ellipse cx="200" cy="100" rx="62" ry="15" fill="#3D6B8C"/>
    <ellipse cx="200" cy="98" rx="60" ry="13" fill="#E8F4FA"/>

    <path d="M 138 100 L 138 250 C 138 265, 262 265, 262 250 L 262 100 Z" fill="url(#prussianBlue)" stroke="#16384F" stroke-width="1.5"/>

    <ellipse cx="200" cy="250" rx="62" ry="15" fill="#142B3C"/>
    <ellipse cx="200" cy="254" rx="64" ry="14" fill="none" stroke="#B87333" stroke-width="3"/>

    <!-- Prussian Blue Sun-Print Eucalyptus & Fern Silhouettes in Crisp White -->
    <!-- Center Eucalyptus Branch Silhouette -->
    <g transform="translate(198, 175) rotate(-6)" fill="#FFFFFF" opacity="0.92">
      <!-- Main Stem -->
      <path d="M -2 60 Q 2 20 0 -50" stroke="#FFFFFF" stroke-width="2" fill="none"/>
      <!-- Round leaves -->
      <ellipse cx="-16" cy="40" rx="12" ry="8" transform="rotate(-15 -16 40)"/>
      <ellipse cx="16" cy="30" rx="13" ry="9" transform="rotate(20 16 30)"/>
      <ellipse cx="-18" cy="10" rx="12" ry="8" transform="rotate(-25 -18 10)"/>
      <ellipse cx="17" cy="-5" rx="11" ry="8" transform="rotate(15 17 -5)"/>
      <ellipse cx="-14" cy="-22" rx="10" ry="7" transform="rotate(-20 -14 -22)"/>
      <ellipse cx="14" cy="-35" rx="9" ry="6" transform="rotate(25 14 -35)"/>
      <ellipse cx="0" cy="-50" rx="6" ry="5"/>
    </g>

    <!-- Side Botanical Grasses -->
    <g fill="none" stroke="#FFFFFF" opacity="0.85" stroke-linecap="round">
      <path d="M 160 240 Q 155 190 148 160" stroke-width="1.5"/>
      <path d="M 155 195 Q 148 185 142 180" stroke-width="1.2"/>
      <path d="M 235 240 Q 242 195 248 170" stroke-width="1.5"/>
      <path d="M 240 205 Q 248 195 252 190" stroke-width="1.2"/>
    </g>

    <!-- Warm internal light glowing softly through blue print -->
    <ellipse cx="200" cy="180" rx="25" ry="35" fill="#FFEAA8" opacity="0.45" filter="blur(8px)"/>
  </g>

  <!-- Craft Badge -->
  <g transform="translate(280, 35)">
    <rect x="0" y="0" width="90" height="26" rx="4" fill="#FAF1DF" stroke="#D1BEA4" stroke-width="1"/>
    <text x="45" y="17" font-family="'Courier New', monospace" font-size="11" fill="#785E42" font-weight="bold" text-anchor="middle">SOLAR PRINT</text>
  </g>
</svg>

