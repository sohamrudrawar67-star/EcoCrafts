<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" width="100%" height="100%">
  <defs>
    <radialGradient id="nordicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3DA" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#FCDCA0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F5B942" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5EFE6"/>
      <stop offset="25%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDE5D8"/>
    </linearGradient>
    <linearGradient id="woodBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C29B70"/>
      <stop offset="100%" stop-color="#9E764C"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#443525" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#FBF9F5" rx="16"/>

  <!-- Ambient Glow Behind Lantern -->
  <circle cx="200" cy="190" r="145" fill="url(#nordicGlow)"/>

  <!-- Hanging Cord / Loop -->
  <path d="M 200 45 L 200 100" stroke="#7D6F5E" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="200" cy="45" r="4" fill="none" stroke="#7D6F5E" stroke-width="2.5"/>

  <!-- Top Wooden Cap -->
  <ellipse cx="200" cy="100" rx="46" ry="10" fill="url(#woodBase)"/>
  <ellipse cx="200" cy="98" rx="42" ry="7" fill="#D4B085"/>

  <!-- Main Fluted Paper Body -->
  <g filter="url(#softShadow)">
    <path d="M 154 100 Q 130 190 150 270 L 250 270 Q 270 190 246 100 Z" fill="url(#paperGrad)" stroke="#DFD5C6" stroke-width="1.2"/>
    
    <!-- Fluted Paper Fold Lines -->
    <path d="M 170 102 Q 152 190 168 269" stroke="#E6DCD0" stroke-width="1.5" fill="none"/>
    <path d="M 186 104 Q 175 190 185 270" stroke="#DECFC0" stroke-width="1.5" fill="none"/>
    <path d="M 200 105 L 200 270" stroke="#EFE7DC" stroke-width="2" fill="none"/>
    <path d="M 214 104 Q 225 190 215 270" stroke="#DECFC0" stroke-width="1.5" fill="none"/>
    <path d="M 230 102 Q 248 190 232 269" stroke="#E6DCD0" stroke-width="1.5" fill="none"/>

    <!-- Subtle horizontal bamboo rings -->
    <path d="M 142 160 Q 200 174 258 160" stroke="#EAD4A6" stroke-width="1.2" fill="none" opacity="0.8"/>
    <path d="M 140 210 Q 200 226 260 210" stroke="#EAD4A6" stroke-width="1.2" fill="none" opacity="0.8"/>
  </g>

  <!-- Wooden Bottom Pedestal -->
  <ellipse cx="200" cy="272" rx="55" ry="12" fill="url(#woodBase)"/>
  <ellipse cx="200" cy="270" rx="53" ry="10" fill="#E0BC92"/>
  <rect x="175" y="278" width="50" height="8" rx="3" fill="#8C663F"/>

  <!-- Warm Internal Candle Glow / Flame Hint -->
  <ellipse cx="200" cy="188" rx="24" ry="36" fill="#FFE59E" opacity="0.85" filter="blur(7px)"/>
  <circle cx="200" cy="188" r="9" fill="#FFFBE6"/>
</svg>
