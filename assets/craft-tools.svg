<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%">
  <defs>
    <filter id="toolShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#554433" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Craft Mat Background -->
  <rect width="100%" height="100%" rx="16" fill="#F4EEE4"/>
  <rect x="8" y="8" width="484" height="224" rx="12" fill="none" stroke="#DECBB6" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- Ruler Marks along top edge -->
  <g stroke="#C2B09B" stroke-width="1">
    <line x1="40" y1="12" x2="40" y2="22"/>
    <line x1="60" y1="12" x2="60" y2="18"/>
    <line x1="80" y1="12" x2="80" y2="24"/>
    <line x1="100" y1="12" x2="100" y2="18"/>
    <line x1="120" y1="12" x2="120" y2="24"/>
    <line x1="140" y1="12" x2="140" y2="18"/>
    <line x1="160" y1="12" x2="160" y2="24"/>
    <line x1="180" y1="12" x2="180" y2="18"/>
    <line x1="200" y1="12" x2="200" y2="24"/>
    <line x1="220" y1="12" x2="220" y2="18"/>
    <line x1="240" y1="12" x2="240" y2="24"/>
    <line x1="260" y1="12" x2="260" y2="18"/>
    <line x1="280" y1="12" x2="280" y2="24"/>
    <line x1="300" y1="12" x2="300" y2="18"/>
    <line x1="320" y1="12" x2="320" y2="24"/>
    <line x1="340" y1="12" x2="340" y2="18"/>
    <line x1="360" y1="12" x2="360" y2="24"/>
    <line x1="380" y1="12" x2="380" y2="18"/>
    <line x1="400" y1="12" x2="400" y2="24"/>
    <line x1="420" y1="12" x2="420" y2="18"/>
    <line x1="440" y1="12" x2="440" y2="24"/>
    <line x1="460" y1="12" x2="460" y2="18"/>
  </g>

  <!-- Brass Tailor Craft Scissors -->
  <g transform="translate(65, 50) rotate(22)" filter="url(#toolShadow)">
    <!-- Finger loop 1 -->
    <ellipse cx="20" cy="120" rx="16" ry="24" fill="none" stroke="#B38A52" stroke-width="5"/>
    <ellipse cx="20" cy="120" rx="13" ry="21" fill="none" stroke="#D8B57D" stroke-width="1.5"/>
    <!-- Finger loop 2 -->
    <circle cx="50" cy="120" r="16" fill="none" stroke="#B38A52" stroke-width="5"/>
    <circle cx="50" cy="120" r="13" fill="none" stroke="#D8B57D" stroke-width="1.5"/>
    <!-- Pivot screw -->
    <circle cx="34" cy="75" r="4" fill="#664D2B"/>
    <circle cx="34" cy="75" r="2" fill="#E8CD97"/>
    <!-- Blade 1 -->
    <path d="M 32 75 L 15 10 Q 22 25 35 75 Z" fill="#D3CBC2" stroke="#A89F95" stroke-width="1"/>
    <!-- Blade 2 -->
    <path d="M 36 75 L 48 10 Q 40 25 33 75 Z" fill="#E8E2D8" stroke="#B5ADA2" stroke-width="1"/>
  </g>

  <!-- Wooden Bone Folder / Paper Creaser -->
  <g transform="translate(160, 55) rotate(-15)" filter="url(#toolShadow)">
    <path d="M 10 10 Q 20 5 30 10 L 25 130 Q 18 142 12 130 Z" fill="#DDBE97" stroke="#BA986E" stroke-width="1.5"/>
    <line x1="16" y1="20" x2="16" y2="120" stroke="#EED8BB" stroke-width="2"/>
    <line x1="22" y1="25" x2="22" y2="115" stroke="#C7A57B" stroke-width="1.5"/>
  </g>

  <!-- Spool of Natural Jute Twine -->
  <g transform="translate(230, 95)" filter="url(#toolShadow)">
    <rect x="0" y="0" width="55" height="75" rx="10" fill="#BA966E" stroke="#8A663F" stroke-width="1.5"/>
    <!-- Twine winding ridges -->
    <path d="M 0 15 Q 27 22 55 15" stroke="#DFCCA8" stroke-width="3" fill="none"/>
    <path d="M 0 30 Q 27 37 55 30" stroke="#DFCCA8" stroke-width="3" fill="none"/>
    <path d="M 0 45 Q 27 52 55 45" stroke="#DFCCA8" stroke-width="3" fill="none"/>
    <path d="M 0 60 Q 27 67 55 60" stroke="#DFCCA8" stroke-width="3" fill="none"/>
    <!-- Loose thread tail -->
    <path d="M 45 65 Q 75 75 80 110" stroke="#C7A97E" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Amber Bottle of Non-Toxic Craft Gum / Varnish -->
  <g transform="translate(330, 70)" filter="url(#toolShadow)">
    <!-- Cork stopper -->
    <polygon points="18,0 36,0 33,14 21,14" fill="#C29D70"/>
    <rect x="19" y="14" width="16" height="8" fill="#8F6538"/>
    <!-- Bottle glass -->
    <rect x="5" y="22" width="44" height="68" rx="8" fill="#755030"/>
    <!-- Parchment Label -->
    <rect x="10" y="38" width="34" height="40" rx="3" fill="#FBF7EE" stroke="#D3C3A8" stroke-width="1"/>
    <text x="27" y="52" font-family="'Courier New', monospace" font-size="8" fill="#5E432A" text-anchor="middle" font-weight="bold">SLOW</text>
    <text x="27" y="63" font-family="'Courier New', monospace" font-size="7" fill="#876646" text-anchor="middle">GLUE</text>
  </g>

  <!-- Fine Bristle Craft Brush -->
  <g transform="translate(395, 45) rotate(35)" filter="url(#toolShadow)">
    <!-- Wooden handle -->
    <polygon points="4,150 10,150 8,35 6,35" fill="#5A3A1F"/>
    <!-- Silver ferrule -->
    <rect x="4" y="20" width="6" height="16" fill="#C4BDB5" stroke="#9A9289" stroke-width="0.8"/>
    <!-- Soft bristles with watercolor tip -->
    <path d="M 4 20 Q 3 2 7 0 Q 11 2 10 20 Z" fill="#EADCC7"/>
    <path d="M 5 8 Q 7 0 9 8 Z" fill="#C9735A"/>
  </g>
</svg>

